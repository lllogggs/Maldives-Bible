    <script>
      (() => {
        const productionHostnames = new Set([
          "maldivesbible.com",
          "www.maldivesbible.com",
        ]);

        const campaignParams = new URLSearchParams(window.location.search);
        const cleanCampaignValue = (value) => {
          const normalized = value?.trim().toLowerCase().slice(0, 100);
          return normalized && /^[a-z0-9]+(?:_[a-z0-9]+)*$/.test(normalized)
            ? normalized
            : null;
        };
        const campaignAttribution = {
          utm_source: cleanCampaignValue(campaignParams.get("utm_source")),
          utm_medium: cleanCampaignValue(campaignParams.get("utm_medium")),
          utm_campaign: cleanCampaignValue(campaignParams.get("utm_campaign")),
        };
        if (
          campaignAttribution.utm_source &&
          campaignAttribution.utm_medium &&
          campaignAttribution.utm_campaign
        ) {
          const content = cleanCampaignValue(campaignParams.get("utm_content"));
          const term = cleanCampaignValue(campaignParams.get("utm_term"));
          const attribution = {
            ...campaignAttribution,
            captured_at: new Date().toISOString(),
            landing_page: `${window.location.pathname}${window.location.search}${window.location.hash}`.slice(0, 500),
            ...(content ? { utm_content: content } : {}),
            ...(term ? { utm_term: term } : {}),
          };
          try {
            window.sessionStorage.setItem("mb_campaign_attribution_v1", JSON.stringify(attribution));
          } catch {
            // Session storage may be unavailable in privacy-restricted contexts.
          }
        }

        if (!productionHostnames.has(window.location.hostname.toLowerCase())) {
          return;
        }

        const measurementId = "G-Y00T1V6W91";
        window.dataLayer = window.dataLayer || [];
        window.gtag = window.gtag || function () {
          window.dataLayer.push(arguments);
        };
        window.gtag("js", new Date());
        window.gtag("config", measurementId, { send_page_view: false });

        const sendStaticPageView = () => {
          const root = document.getElementById("root");
          if (root?.dataset.staticPage !== "true") {
            return;
          }

          const initialParams = new URLSearchParams(window.location.search);
          const legacyView = initialParams.get("view");
          const viewSuffix = legacyView ? `?view=${encodeURIComponent(legacyView)}` : "";
          window.__MB_LAST_PAGE_VIEW__ = `${window.location.pathname}${viewSuffix}${window.location.hash}`;
          window.gtag("event", "page_view", {
            page_title: document.title,
            page_location: window.location.href,
            page_path: `${window.location.pathname}${window.location.search}${window.location.hash}`,
          });
        };

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", sendStaticPageView, { once: true });
        } else {
          sendStaticPageView();
        }

        const googleTag = document.createElement("script");
        googleTag.async = true;
        googleTag.src = `https://www.googletagmanager.com/gtag/js?id=${measurementId}`;
        document.head.appendChild(googleTag);

        const clarityProjectId = "u13oj1cs74";
        window.clarity = window.clarity || function () {
          (window.clarity.q = window.clarity.q || []).push(arguments);
        };
        const clarityTag = document.createElement("script");
        clarityTag.async = true;
        clarityTag.src = `https://www.clarity.ms/tag/${clarityProjectId}`;
        document.head.appendChild(clarityTag);
      })();
    </script>
