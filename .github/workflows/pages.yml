name: Deploy to GitHub Pages
on:
  push:
    branches: [ main ]   # main에 푸시하면 배포
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp -R * dist/ 2>/dev/null || true
          # ★ 커스텀 도메인 고정(매 배포마다 문패 달기)
          echo "maldivesbible.com" > dist/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
