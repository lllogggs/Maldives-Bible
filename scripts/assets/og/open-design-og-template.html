<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1200, initial-scale=1" />
    <title>몰디브 바이블 OG 이미지</title>
    <!--
      Adapted from Open Design's first-party Image Poster example.
      Source: https://github.com/nexu-io/open-design/tree/main/design-templates/image-poster
      License: Apache-2.0. See OPEN-DESIGN-NOTICE.md in this directory.
    -->
    <style>
      @font-face {
        font-family: 'NanumSquareNeo';
        src: url('../../../public/fonts/nanum-square-neo/NanumSquareNeoTTF-bRg.woff2') format('woff2');
        font-style: normal;
        font-weight: 400;
        font-display: block;
      }

      @font-face {
        font-family: 'NanumSquareNeo';
        src: url('../../../public/fonts/nanum-square-neo/NanumSquareNeoTTF-cBd.woff2') format('woff2');
        font-style: normal;
        font-weight: 700;
        font-display: block;
      }

      @font-face {
        font-family: 'NanumSquareNeo';
        src: url('../../../public/fonts/nanum-square-neo/NanumSquareNeoTTF-dEb.woff2') format('woff2');
        font-style: normal;
        font-weight: 800;
        font-display: block;
      }

      :root {
        --ink: #f7f3e9;
        --muted: rgba(247, 243, 233, 0.96);
        --deep-water: #003746;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
        overflow: hidden;
        background: var(--deep-water);
      }

      body {
        font-family: 'NanumSquareNeo', sans-serif;
      }

      .poster {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        isolation: isolate;
      }

      .resort {
        position: absolute;
        inset: 0;
        z-index: -3;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 50% 50%;
        filter: saturate(0.94) contrast(1.035);
        transform: scale(1.002);
      }

      .poster::before {
        position: absolute;
        inset: 0;
        z-index: -2;
        content: '';
        background:
          linear-gradient(
            90deg,
            rgba(0, 38, 50, 0.93) 0%,
            rgba(0, 47, 61, 0.82) 36%,
            rgba(0, 47, 61, 0.57) 53%,
            rgba(0, 47, 61, 0.12) 72%,
            rgba(0, 47, 61, 0) 84%
          ),
          linear-gradient(180deg, rgba(0, 23, 31, 0.06), rgba(0, 35, 44, 0.03));
      }

      /* Open Design Image Poster texture: restrained radial light plus 1 px grain. */
      .poster::after {
        position: absolute;
        inset: 0;
        z-index: 3;
        pointer-events: none;
        content: '';
        background:
          radial-gradient(circle at 23% 28%, rgba(255, 255, 255, 0.11), transparent 36%),
          repeating-linear-gradient(
            0deg,
            rgba(255, 255, 255, 0.018) 0 1px,
            rgba(0, 23, 31, 0.014) 1px 2px
          );
        mix-blend-mode: soft-light;
        opacity: 0.72;
      }

      .lockup {
        position: absolute;
        top: 50%;
        left: 50%;
        z-index: 1;
        transform: translate(-50%, -50%);
        color: var(--ink);
        text-align: center;
      }

      .wordmark {
        margin: 0;
        background: linear-gradient(180deg, #fffef9 0%, #f8f2e7 48%, #dfd3bc 100%);
        background-clip: text;
        -webkit-background-clip: text;
        color: var(--ink);
        font-size: 62px;
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.035em;
        -webkit-text-fill-color: transparent;
        text-rendering: geometricprecision;
        filter:
          drop-shadow(0 -1px 0 rgba(255, 255, 255, 0.1))
          drop-shadow(0 3px 2px rgba(0, 18, 25, 0.54))
          drop-shadow(0 12px 28px rgba(0, 20, 28, 0.26));
        white-space: nowrap;
      }

      .tagline {
        margin: 26px 0 0;
        color: var(--muted);
        font-size: 36px;
        font-weight: 700;
        line-height: 1.25;
        letter-spacing: -0.01em;
        text-shadow:
          0 2px 1px rgba(0, 18, 25, 0.62),
          0 8px 18px rgba(0, 20, 28, 0.28);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <main class="poster" aria-label="몰디브 바이블, 리조트 비교를 더 쉽게">
      <img
        class="resort"
        src="./fictional-luxury-maldives-resort.png"
        alt=""
        width="1200"
        height="630"
      />
      <section class="lockup">
        <h1 class="wordmark">몰디브 바이블</h1>
        <p class="tagline">리조트 비교를 더 쉽게</p>
      </section>
    </main>
  </body>
</html>
